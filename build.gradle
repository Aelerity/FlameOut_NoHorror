plugins{
    id 'java'
}

version = '1.2.0'
sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

sourceSets{
    main.java.srcDirs = ['src']
    test.java.srcDirs = ['tests']
}

// Compile and test against the actual released game, not mismatched Arc snapshots.
// The game is compile/test-only and must never be bundled into the mod.
def gameJar = providers.gradleProperty('mindustryJar').map { file(it) }
    .orElse(layout.buildDirectory.file('dependencies/server-v160.7.jar').map { it.asFile })

tasks.register('downloadMindustry'){
    outputs.file(gameJar)
    doLast{
        def target = gameJar.get()
        if(!target.exists()){
            target.parentFile.mkdirs()
            new URL('https://github.com/Anuken/Mindustry/releases/download/v160.7/server-release.jar').withInputStream { input ->
                target.withOutputStream { output -> output << input }
            }
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
        if(actual != 'f7b899a4038b95b14a824d5f8993984f79d73baa3254c385b6538327f9c0befd'){
            throw new GradleException('Mindustry v160.7 dependency checksum mismatch: ' + actual)
        }
    }
}

dependencies{
    compileOnly files(gameJar).builtBy('downloadMindustry')
    testImplementation files(gameJar).builtBy('downloadMindustry')
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = 'UTF-8'
    options.release = 17
}

jar{
    archiveFileName = 'FlameOut_NoHorror.jar'
    includeEmptyDirs = false
    from(rootDir){
        include 'mod.json', 'icon.png'
    }
    from('assets/'){
        include '**'
    }
}

tasks.register('verifyMod', JavaExec){
    dependsOn testClasses, jar
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'flame.CompatibilityTest'
    systemProperty 'mod.jar', tasks.jar.archiveFile.get().asFile.absolutePath
    workingDir = layout.buildDirectory.dir('verification').get().asFile
    doFirst{ workingDir.mkdirs() }
}

check.dependsOn verifyMod

// Retain the existing desktop build command. Android is not a supported target.
tasks.register('deploy'){
    dependsOn build
}
